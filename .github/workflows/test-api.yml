name: Test Gemini API Key

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test API Key - Multiple Models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== Testando modelos disponíveis ==="
          
          MODELS=("gemini-2.5-flash" "gemini-2.0-flash" "gemini-2.0-flash-lite" "gemini-2.5-flash-lite" "gemini-3.1-flash-lite")
          
          for MODEL in "${MODELS[@]}"; do
            echo ""
            echo "--- Testando: $MODEL ---"
            RESULT=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=$GEMINI_API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{"contents":[{"parts":[{"text":"Diga apenas: OK"}]}]}')
            
            ERROR=$(echo "$RESULT" | jq -r '.error.code // empty')
            if [ -z "$ERROR" ]; then
              CONTENT=$(echo "$RESULT" | jq -r '.candidates[0].content.parts[0].text // "sem resposta"')
              echo "✅ FUNCIONOU! Resposta: $CONTENT"
            else
              MSG=$(echo "$RESULT" | jq -r '.error.message' | head -1 | cut -c1-100)
              echo "❌ Erro $ERROR: $MSG"
            fi
          done
