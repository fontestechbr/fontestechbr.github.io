name: Test Gemini API Key

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test API Key - List Models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== Listando modelos disponíveis ==="
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY" | jq '[.models[].name]'
          
          echo ""
          echo "=== Testando gemini-2.0-flash (v1beta) ==="
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"contents":[{"parts":[{"text":"Diga apenas: OK"}]}]}' | jq '{error: .error, hasContent: (.candidates[0].content.parts[0].text // null)}'
          
          echo ""
          echo "=== Testando gemini-2.0-flash (v1) ==="
          curl -s "https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"contents":[{"parts":[{"text":"Diga apenas: OK"}]}]}' | jq '{error: .error, hasContent: (.candidates[0].content.parts[0].text // null)}'
