name: Generate Daily Article

on:
  schedule:
    # Gera um artigo novo todos os dias às 7h UTC (4h BRT)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      title:
        description: 'Título do artigo (deixe vazio para a IA escolher)'
        required: false
      keyword:
        description: 'Palavra-chave principal'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x scripts/generate_article.sh scripts/generate_topic.sh
          
          if [ -n "${{ github.event.inputs.title }}" ]; then
            # Título manual
            ./scripts/generate_article.sh "${{ github.event.inputs.title }}" "${{ github.event.inputs.keyword }}"
          else
            # IA escolhe o tema automaticamente
            ./scripts/generate_topic.sh
          fi

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Auto Article"
          git add content/posts/
          
          if git diff --staged --quiet; then
            echo "Nenhum artigo novo para commitar"
            exit 0
          else
            git commit -m "📝 Novo artigo publicado automaticamente"
            git push
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Sao_Paulo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
